name: Update GPX List

on:
  push:
    paths:
      - "misc/assets/gpx/**"

permissions:
  contents: write

jobs:
  update-gpx-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GPX file list
        run: |
          python3 << 'PY'
          import os
          import json

          gpx_dir = "misc/assets/gpx"
          output = "misc/assets/js/gpx-files.js"

          files = []

          for filename in os.listdir(gpx_dir):
              if filename.lower().endswith(".gpx"):
                  files.append(
                      f"/misc/assets/gpx/{filename}"
                  )

          files.sort()

          with open(output, "w", encoding="utf-8") as f:
              f.write("const gpxFiles = ")
              json.dump(
                  files,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write(";\n")

          print(f"Found {len(files)} GPX files.")
          PY

      - name: Commit updated GPX list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add misc/assets/js/gpx-files.js

          git diff --cached --quiet || \
          git commit -m "Update GPX file list"

          git push